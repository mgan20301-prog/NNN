<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> هورس بلاي | Dream Live</title>
    <style>
        :root {
            --bg-color: #0f0f15;
            --card-bg: #1a1a24;
            --accent-color: #7289da;
            --text-color: #ffffff;
            --green: #2ed573;
            --red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }

        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 21, 0.98); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px;
        }
        #welcome-screen h1 { font-size: 2rem; margin-bottom: 20px; color: var(--accent-color); }
        .skip-btn {
            background: var(--accent-color); color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; border-radius: 25px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(114, 137, 218, 0.4);
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--card-bg); border-bottom: 2px solid #2a2a38;
        }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .status-online { background: rgba(46, 213, 115, 0.2); color: var(--green); border: 1px solid var(--green); }
        .status-offline { background: rgba(255, 71, 87, 0.2); color: var(--red); border: 1px solid var(--red); }
        .menu-icon { font-size: 1.8rem; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; right: -280px; width: 250px; height: 100%;
            background: var(--card-bg); box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: 0.3s; z-index: 1000; padding: 20px;
        }
        .sidebar.active { right: 0; }
        .sidebar h3 { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .sidebar-item {
            padding: 12px; background: #252533; margin-bottom: 10px;
            border-radius: 8px; cursor: pointer; text-align: center;
        }

        .hero {
            text-align: center; padding: 30px 15px;
            background: linear-gradient(to bottom, rgba(15,15,21,0.7), var(--bg-color));
            border-bottom: 1px solid #2a2a38;
        }
        .hero img.hero-gif { width: 100%; max-width: 400px; border-radius: 12px; margin-bottom: 15px; }
        .stats-card {
            background: var(--card-bg); display: inline-block; padding: 15px 30px;
            border-radius: 12px; margin-top: 10px; border: 1px solid #2a2a38;
        }

        .section-title { text-align: center; margin: 30px 0 15px; font-size: 1.5rem; }
        .store-banner-gif { width: 90%; max-width: 500px; display: block; margin: 0 auto 20px; border-radius: 12px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; padding: 0 15px; }
        .product-card { background: var(--card-bg); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #2a2a38; }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .product-card h4 { margin: 10px 0 5px; }
        .product-card .price { color: var(--green); font-weight: bold; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; overflow-y: auto; padding: 20px;
        }
        .modal-content { background: var(--card-bg); max-width: 500px; margin: 40px auto; padding: 20px; border-radius: 12px; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 10px; margin: 8px 0; background: #0f0f15;
            border: 1px solid #333; color: white; border-radius: 6px;
        }
        .btn-action {
            width: 100%; padding: 10px; background: var(--accent-color); border: none;
            color: white; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1>أهلاً وسهلاً فيك في موقع دريم لايف 🎮</h1>
        <button class="skip-btn" onclick="closeWelcome()">تخطي وتصفح الموقع</button>
    </div>

    <div class="sidebar" id="sidebar">
        <h3>القائمة</h3>
        <div class="sidebar-item" onclick="openAdminPass()">⚙️ تطوير الموقع (المطور)</div>
        <div class="sidebar-item" onclick="toggleSidebar()">إغلاق</div>
    </div>

    <header>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
        <h2>Dream Live</h2>
        <div id="server-status" class="status-badge status-online">الماب: شغال 🟢</div>
    </header>

    <div class="hero">
        <img id="main-gif" class="hero-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW10ZXF2cm94M21pdHJuZnlrYmhxcm5yeTBnY244ZjJnYmVxdGNidyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L3N37g8C4Gv4yG9Fbc/giphy.gif" alt="GIF">
        <h1>سيرفر دريم لايف روبلكس</h1>
        <div class="stats-card">
            <p>👥 المتواجدين حالياً داخل السيرفر:</p>
            <h2 id="player-count">45 لاعب</h2>
        </div>
    </div>

    <h2 class="section-title">📺 قناة مؤسس السيرفر</h2>
    <div style="text-align: center; padding: 10px;">
        <iframe id="yt-frame" width="90%" height="200" src="https://www.youtube.com/embed/live_stream?channel=UC" frameborder="0" allowfullscreen style="border-radius: 12px; max-width: 500px;"></iframe>
    </div>

    <h2 class="section-title">🛒 متجر دريم لايف</h2>
    <img id="store-gif" class="store-banner-gif" src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Store GIF">
    
    <div class="grid" id="product-list"></div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3>⚙️ لوحة تحكم المطور الشاملة</h3>
            <label>حالة الماب:</label>
            <select id="status-input">
                <option value="online">شغال 🟢</option>
                <option value="offline">طافي 🔴</option>
            </select>

            <label>عدد اللاعبين المتواجدين:</label>
            <input type="text" id="players-input" value="45 لاعب">

            <label>رابط GIF للموقع الرئيسي:</label>
            <input type="text" id="main-gif-input">

            <label>رابط GIF للمتجر:</label>
            <input type="text" id="store-gif-input">

            <hr style="margin: 15px 0; border-color: #333;">
            <h4>إضافة منتج جديد:</h4>
            <input type="text" id="p-title" placeholder="اسم المنتج">
            <input type="text" id="p-price" placeholder="السعر">
            <input type="text" id="p-img" placeholder="رابط الصورة">

            <button class="btn-action" onclick="saveAdminChanges()">حفظ وتحديث 💾</button>
            <button class="btn-action" style="background: var(--red); margin-top: 5px;" onclick="closeAdmin()">إغلاق</button>
        </div>
    </div>

    <script>
        function closeWelcome() { document.getElementById('welcome-screen').style.display = 'none'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

        // كلمة السر الحالية هي: 1234
        const SEC_PASS = "MTIzNA=="; 

        function openAdminPass() {
            let pass = prompt("أدخل كلمة سر مطور الموقع:");
            if (btoa(pass) === SEC_PASS) {
                toggleSidebar();
                document.getElementById('admin-modal').style.display = 'block';
            } else {
                alert("كلمة السر خاطئة!");
            }
        }

        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        function saveAdminChanges() {
            let status = document.getElementById('status-input').value;
            let statusElem = document.getElementById('server-status');
            if(status === 'online') {
                statusElem.className = 'status-badge status-online';
                statusElem.innerText = 'الماب: شغال 🟢';
            } else {
                statusElem.className = 'status-badge status-offline';
                statusElem.innerText = 'الماب: طافي 🔴';
            }

            document.getElementById('player-count').innerText = document.getElementById('players-input').value;

            let mainGif = document.getElementById('main-gif-input').value;
            if(mainGif) document.getElementById('main-gif').src = mainGif;

            let storeGif = document.getElementById('store-gif-input').value;
            if(storeGif) document.getElementById('store-gif').src = storeGif;

            let pTitle = document.getElementById('p-title').value;
            let pPrice = document.getElementById('p-price').value;
            let pImg = document.getElementById('p-img').value;

            if(pTitle && pPrice) {
                let productList = document.getElementById('product-list');
                let newProd = document.createElement('div');
                newProd.className = 'product-card';
                newProd.innerHTML = `
                    <img src="${pImg || 'https://via.placeholder.com/150'}" alt="${pTitle}">
                    <h4>${pTitle}</h4>
                    <div class="price">${pPrice}</div>
                `;
                productList.appendChild(newProd);
            }

            alert("تم حفظ وتحديث البيانات بنجاح! 🔥");
            closeAdmin();
        }
    </script>
</body>
</html>
