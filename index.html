<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديوان الحرف | لوحة الأبيات الشعرية</title>
    <!-- استيراد خطوط عربية مميزة من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --accent: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* بطاقة البيت الشعري */
        .poem-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .poem-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
        }

        .poem-content {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.2;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .poem-verse {
            display: block;
            margin-bottom: 0.5rem;
        }

        .poet-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .poet-name {
            color: var(--gold);
            font-weight: 600;
        }

        /* أزرار التفاعل */
        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
        }

        .btn-action:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* قسم إضافة بيت جديد */
        .add-poem-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .add-poem-section h3 {
            font-family: 'Amiri', serif;
            color: var(--gold);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }

        .btn-submit {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
        }

        .btn-submit:hover {
            background: var(--gold-hover);
        }

        footer {
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>ديوان الحرف</h1>
        <p>مختارات أدبية وأبيات خالدة من عيون الشعر العربي</p>
    </header>

    <div class="container" id="poemsContainer">
        <!-- الأبيات ستظهر هنا ديناميكياً عبر الجافاسكريبت -->
    </div>

    <div class="container">
        <div class="add-poem-section">
            <h3>أضف بيتاً للشعر</h3>
            <form id="poemForm">
                <div class="form-group">
                    <label for="verseFirst">الشطر الأول</label>
                    <input type="text" id="verseFirst" class="form-control" placeholder="مثال: ألا ليت الشباب يرجع يوماً" required>
                </div>
                <div class="form-group">
                    <label for="verseSecond">الشطر الثاني</label>
                    <input type="text" id="verseSecond" class="form-control" placeholder="مثال: فأخبره بما فعل المشيبُ" required>
                </div>
                <div class="form-group">
                    <label for="poetName">اسم الشاعر</label>
                    <input type="text" id="poetName" class="form-control" placeholder="مثال: أبو العتاهية" required>
                </div>
                <button type="submit" class="btn-submit">نشر البيت في الديوان</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 ديوان الحرف</p>
    </footer>

    <script>
        // قاعدة بيانات أولية للأبيات
        let poems = [
            {
                first: "سأصبر حتى يعجز الصبر عن صبري",
                second: "سأصبر حتى ينظر الله في أمري",
                poet: "الإمام الشافعي"
            },
            {
                first: "وإذا العناية لاحظتك عيونها",
                second: "نام فالمحارث كلهن حراسة",
                poet: "الإمام الشافعي"
            },
            {
                first: "أنا الذي نظل الأعمى إلى أدبي",
                second: "وأسمعت كلماتي من به صممُ",
                poet: "المتنبي"
            }
        ];

        const poemsContainer = document.getElementById('poemsContainer');
        const poemForm = document.getElementById('poemForm');

        // دالة لعرض الأبيات
        function renderPoems() {
            poemsContainer.innerHTML = '';
            poems.forEach((poem, index) => {
                const card = document.createElement('div');
                card.className = 'poem-card';
                card.innerHTML = `
                    <div class="poem-content">
                        <span class="poem-verse">${poem.first}</span>
                        <span class="poem-verse">${poem.second}</span>
                    </div>
                    <div class="poet-info">
                        <span class="poet-name">الشاعر: ${poem.poet}</span>
                        <div class="card-actions">
                            <button class="btn-action" onclick="copyPoem('${poem.first}', '${poem.second}', '${poem.poet}')">نسخ</button>
                        </div>
                    </div>
                `;
                poemsContainer.appendChild(card);
            });
        }

        // دالة نسخ البيت الشعري
        function copyPoem(first, second, poet) {
            const textToCopy = `${first}\n${second}\n\n- الشاعر: ${poet}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('تم نسخ البيت بنجاح!');
            });
        }

        // معالجة نموذج إضافة بيت جديد
        poemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const first = document.getElementById('verseFirst').value;
            const second = document.getElementById('verseSecond').value;
            const poet = document.getElementById('poetName').value;

            poems.unshift({ first, second, poet }); // إضافة البيت الجديد في البداية
            renderPoems();
            poemForm.reset();
        });

        // تشغيل الدالة عند تحميل الصفحة
        renderPoems();
    </script>
</body>
</html>
